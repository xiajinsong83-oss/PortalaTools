# ============================================================
# Portala Tools — Hugo configuration
# Site name:  Portala Tools
# Domain:     https://portalaser.cn (confirmed)
# Theme:      PaperMod v8 (vendored under themes/PaperMod)
# Before going live, only these remain to fill in:
#   googleAdsenseClient -> your Google AdSense publisher ID (optional for now)
#   static/ads.txt      -> replace the placeholder with your real publisher ID
# See README.md "Before you go live" for the full checklist.
# ============================================================

baseURL = "https://portalaser.cn/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Portala Tools"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
timeout = "60s"
disableKinds = ["taxonomy", "term"]

# Output JSON index.json for the client-side (Fuse.js) search
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  # Tool pages embed raw HTML (tool UI) and <script> tags in Markdown —
  # required for every tool page to function.
  unsafe = true

[params]
  env = "production"
  description = "Free online tools for developers and everyday tasks. Everything runs 100% locally in your browser: no uploads, no signup, no tracking."
  keywords = ["free online tools", "developer tools", "json formatter", "base64 encoder", "password generator", "online utilities", "web tools"]
  author = "Portala Tools"
  defaultTheme = "light"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowToc = false
  hideFooter = false
  disableScrollToTop = false

  # Google AdSense publisher ID, e.g. "ca-pub-1234567890123456".
  # Leave empty to render lightweight ad placeholders instead of real ad units.
  googleAdsenseClient = ""

  # Optional Google Analytics 4 — uncomment and fill when you have a property:
  # [params.analytics.google]
  #   id = "G-XXXXXXXXXX"
  #   SiteVerificationTag = ""

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"
    appleTouchIcon = "/favicon.svg"
    theme_color = "#ffffff"
    msapplication_TileColor = "#ffffff"

  [params.label]
    text = "Portala Tools"

# ---------------- Languages ----------------
# English is the default language (served at /), Chinese at /zh/.
# Site-level strings live in i18n/{en,zh}.toml; tool pages carry their
# own per-language front matter.

[languages.en]
  locale = "en-US"
  label = "English"
  weight = 1
  title = "Portala Tools"

[languages.zh]
  contentDir = "zh-content"
  locale = "zh-CN"
  label = "中文"
  weight = 2
  title = "Portala 工具箱"
  [languages.zh.params]
    description = "免费的在线开发者与日常工具集：全部在浏览器本地运行，不上传、不存储、无需注册。"
    keywords = ["在线工具", "开发者工具", "json 格式化", "base64 编码", "密码生成器", "免费在线工具"]
