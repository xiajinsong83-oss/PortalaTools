<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ .Site.Home.RelPermalink }}"><img src="/favicon.png" alt="" class="logo-icon">Stardew Valley <span>Hub</span></a>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <div class="nav-dropdown" id="guidesDrop">
        <button class="nav-drop-btn" onclick="toggleDrop('guidesDrop')">Guides ▾</button>
        <div class="nav-drop-menu">
          <a href="/npc/">NPC Gifts</a>
          <a href="/crops/">Crops</a>
          <a href="/fish/">Fish</a>
          <a href="/bundles/">Bundles</a>
          <a href="/boss/">Bosses</a>
          <a href="/weapons/">Weapons</a>
          <a href="/monsters/">Monsters</a>
          <a href="/museum/">Museum</a>
          <a href="/tier/crop-profit/">Tier</a>
          <a href="/maps/">Maps</a>
        </div>
      </div>
      <!-- 桌面端展开的 Tools 链接 -->
      <div class="tools-expanded">
        <a href="/farm-layout-planner/">Farm Layout Planner</a>
        <a href="/gift/">Gift Lookup</a>
        <a href="/bundles/">CC Checklist</a>
        <a href="/starter/">Starter</a>
        <a href="/fish-checklist/">Fish Check</a>
        <a href="/museum-checklist/">Museum Check</a>
      </div>
      <!-- 手机端收起的 Tools 下拉 -->
      <div class="nav-dropdown tools-collapsed" id="toolsDrop">
        <button class="nav-drop-btn" onclick="toggleDrop('toolsDrop')">Tools ▾</button>
        <div class="nav-drop-menu">
          <a href="/farm-layout-planner/">Farm Layout Planner</a>
          <a href="/gift/">Gift Lookup</a>
          <a href="/bundles/">CC Checklist</a>
          <a href="/starter/">Starter</a>
          <a href="/fish-checklist/">Fish Check</a>
          <a href="/museum-checklist/">Museum Check</a>
        </div>
      </div>
      <a href="/faq/">FAQ</a>
      <a href="/updates/">Updates</a>
    </nav>
    {{ partial "lang-switch.html" . }}
  </div>
</header>
<script>
function toggleDrop(id){
  var d = document.getElementById(id);
  var wasOpen = d.classList.contains('open');
  document.querySelectorAll('.nav-dropdown.open').forEach(function(el){ el.classList.remove('open'); });
  if(!wasOpen){
    d.classList.add('open');
    var btn = d.querySelector('.nav-drop-btn');
    var menu = d.querySelector('.nav-drop-menu');
    var r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.left = r.left + 'px';
  }
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.nav-dropdown')){
    document.querySelectorAll('.nav-dropdown.open').forEach(function(el){ el.classList.remove('open'); });
  }
});
</script>
